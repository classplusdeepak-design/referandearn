<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirecting to Course...</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzAKUIZI7zy6Cypfb9D4VgRyONyQmxUPh_0n9THdfJ96lpZDnrDX3Qv7rUEUTuHW8XX/exec";
  </script>

  <div class="bg-white p-8 rounded-2xl shadow-xl max-w-md w-full text-center border border-slate-100">
    <div class="w-16 h-16 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
      <i class="fa-solid fa-spinner fa-spin"></i>
    </div>
    <h2 class="text-xl font-bold text-slate-900 mb-1">Connecting to Course...</h2>
    <p class="text-xs text-slate-500">Securing your referral link.</p>
  </div>

  <script>
    window.addEventListener("DOMContentLoaded", async () => {
      const params = new URLSearchParams(window.location.search);
      const courseId = params.get("courseId") || "843481";
      const referrerPhone = params.get("ref") || "";

      if (referrerPhone) {
        try {
          fetch(SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            body: JSON.stringify({
              action: "recordLead",
              referrerPhone: referrerPhone,
              buyerPhone: "Click_" + new Date().getTime(),
              courseId: courseId
            })
          });
        } catch (e) {
          console.error(e);
        }
      }

      setTimeout(() => {
        window.location.replace(`https://obqype.courses.store/${courseId}`);
      }, 650);
    });
  </script>
</body>
</html>
